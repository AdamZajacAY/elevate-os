# Blueprint Render — jedna usługa web + jedna baza Postgres.
# Wdrożenie: Render → New → Blueprint → wskaż repozytorium z tym plikiem.
#
# Sekrety oznaczone `sync: false` NIE trafiają do repozytorium — uzupełniasz je
# w panelu Render (Environment). To celowe: klucze Google i sekret sesji nie mogą
# leżeć w gicie.

databases:
  - name: elevate-os-db
    databaseName: elevate_os
    user: elevate
    # Zmień na "starter" albo wyżej, żeby mieć automatyczne kopie zapasowe.
    # Plan "free" kasuje bazę po 30 dniach bezczynności i nie robi kopii.
    plan: free
    postgresMajorVersion: "16"
    # BEZ tego pola Render stawia bazę w Oregonie, niezależnie od regionu usługi.
    # Musi być ten sam region co usługa: inaczej każde zapytanie leci przez Atlantyk,
    # a dane osobowe klientów lądują poza EU (RODO).
    region: frankfurt

services:
  - type: web
    name: elevate-os
    runtime: node
    plan: free
    region: frankfurt
    branch: main

    # `--include=dev` jest konieczne: niżej ustawiamy NODE_ENV=production, a przy
    # tej zmiennej `npm ci` pomija devDependencies — w których są `prisma`,
    # `typescript` i `tailwindcss`, bez których build nie przejdzie.
    buildCommand: npm ci --include=dev && npm run build
    # `start` najpierw dokłada migracje do bazy, potem podnosi serwer.
    startCommand: npm run start

    healthCheckPath: /login

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: elevate-os-db
          property: connectionString

      - key: NODE_VERSION
        value: "22.20.0"

      - key: NODE_ENV
        value: production

      # Sekret sesji — Render wygeneruje losowy przy pierwszym wdrożeniu.
      # UWAGA: tym samym sekretem szyfrowane są tokeny Google (HKDF).
      # Jego zmiana unieważni połączenia z Kalendarzem — trzeba je nawiązać ponownie.
      - key: AUTH_SECRET
        generateValue: true

      # Adres publiczny usługi — Render podstawia go sam.
      - key: AUTH_URL
        fromService:
          type: web
          name: elevate-os
          envVarKey: RENDER_EXTERNAL_URL

      - key: AUTH_TRUST_HOST
        value: "true"

      # Render stoi za odwrotnym proxy, więc X-Forwarded-For jest wiarygodny.
      # Bez tego limit prób logowania widzi wszystkich pod adresem "unknown".
      - key: TRUST_PROXY
        value: "true"

      # Sekret dla harmonogramu (skan powiadomień, sprzątanie retencyjne).
      - key: CRON_SECRET
        generateValue: true

      # ── Opcjonalne — dodaj w panelu Render, gdy będą potrzebne ─────────────
      #
      # Poczta transakcyjna. Bez niej powiadomienia działają, tylko zostają
      # w aplikacji zamiast iść mailem.
      # - key: RESEND_API_KEY
      #   sync: false
      # - key: EMAIL_FROM
      #   sync: false
      #
      # Logowanie Google i synchronizacja z Kalendarzem. Wymaga konta Google
      # Workspace (płatne per użytkownik). Kod jest gotowy i uśpiony — bez tych
      # zmiennych przycisk logowania się nie pokazuje, a panel Kalendarza mówi,
      # że wdrożenie nie ma kluczy. Kalendarz działa też bez Google: feed iCal
      # (zakładka Platforma) subskrybujesz w dowolnym kalendarzu za darmo.
      # - key: GOOGLE_WORKSPACE_DOMAIN
      #   sync: false
      # - key: AUTH_GOOGLE_ID
      #   sync: false
      # - key: AUTH_GOOGLE_SECRET
      #   sync: false

# Harmonogram: skan powiadomień i sprzątanie retencyjne.
# Wymaga planu płatnego (cron jobs nie są dostępne na "free").
# Do czasu przejścia na płatny plan Administrator uruchamia oba z panelu.
