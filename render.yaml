#    runtime: node
#    schedule: "0 6 * * 1-5"
#    buildCommand: npm ci
#    startCommand: >
#      curl -fsS -X POST "$APP_URL/api/cron/scan"
#      -H "Authorization: Bearer $CRON_SECRET"
